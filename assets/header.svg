<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Developer profile banner</title>
  <desc id="desc">A futuristic neon banner with an abstract orbital grid and customizable profile text.</desc>
  <defs>
    <linearGradient id="bg" x1="75" y1="16" x2="1130" y2="344" gradientUnits="userSpaceOnUse"><stop stop-color="#070A12"/><stop offset="0.52" stop-color="#0D1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="line" x1="217" y1="26" x2="972" y2="331" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientTransform="translate(940 52) rotate(133) scale(346 320)" gradientUnits="userSpaceOnUse"><stop stop-color="#7C3AED" stop-opacity="0.28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(207 300) rotate(-27) scale(360 270)" gradientUnits="userSpaceOnUse"><stop stop-color="#0891B2" stop-opacity="0.22"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A78BFA" stroke-opacity="0.075" stroke-width="1"/></pattern>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/><rect width="1200" height="360" fill="url(#glowPurple)"/><rect width="1200" height="360" fill="url(#glowCyan)"/>
    <circle cx="1006" cy="180" r="210" stroke="#A78BFA" stroke-opacity="0.09"/><circle cx="1006" cy="180" r="158" stroke="#22D3EE" stroke-opacity="0.11"/><circle cx="1006" cy="180" r="106" stroke="#EC4899" stroke-opacity="0.13"/>
    <ellipse cx="1006" cy="180" rx="220" ry="72" transform="rotate(-18 1006 180)" stroke="url(#line)" stroke-opacity="0.46" stroke-width="1.5"/><ellipse cx="1006" cy="180" rx="176" ry="58" transform="rotate(37 1006 180)" stroke="url(#line)" stroke-opacity="0.30"/>
    <circle cx="1116" cy="77" r="4" fill="#22D3EE" filter="url(#textGlow)"/><circle cx="850" cy="244" r="5" fill="#EC4899" filter="url(#textGlow)"/><circle cx="1062" cy="292" r="3" fill="#A78BFA" filter="url(#textGlow)"/>
    <g opacity="0.78"><path d="M80 70H172" stroke="url(#line)" stroke-width="2"/><circle cx="70" cy="70" r="4" fill="#22D3EE"/><text x="188" y="75" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">HELLO, WORLD</text></g>
    <text x="70" y="168" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">KITHO LEE</text>
    <text x="73" y="215" fill="url(#line)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" letter-spacing="4" filter="url(#textGlow)">BUILDING • LEARNING • SHIPPING</text>
    <text x="73" y="260" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" letter-spacing="0.7">turning curiosity into code • one commit at a time</text>
    <g transform="translate(72 300)"><circle cx="7" cy="7" r="7" fill="#22C55E" fill-opacity="0.18"/><circle cx="7" cy="7" r="3" fill="#4ADE80"/><text x="23" y="12" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">AVAILABLE FOR COLLABORATION</text></g>
    <path d="M0 358H1200" stroke="url(#line)" stroke-width="4"/>
  </g>
</svg>
