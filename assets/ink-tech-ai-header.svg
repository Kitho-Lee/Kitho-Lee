<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jiehao Li — AI researcher, engineer, and builder</title>
  <desc id="desc">An ivory, black, and gold banner blending Chinese ink landscape art with artificial intelligence circuitry.</desc>
  <defs>
    <linearGradient id="leftVeil" x1="48" y1="200" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.68" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="54" y1="0" x2="1146" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111111"/>
      <stop offset="0.52" stop-color="#777777"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#FFFFFF"/>
    <image href="ink-tech-ai-header-bg-final-1200.png" x="0" y="0" width="1200" height="400"/>
    <rect width="710" height="400" fill="url(#leftVeil)"/>

    <g transform="translate(62 0)">
      <text x="1" y="75" fill="#555555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="2.7">ARTIFICIAL INTELLIGENCE / RESEARCH / SYSTEMS</text>
      <text x="-2" y="173" fill="#111111" font-family="Baskerville, Georgia, Times New Roman, serif" font-size="94" font-weight="400" font-style="italic" letter-spacing="-3">Kitho</text>
      <text x="266" y="169" fill="#555555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="6">LEE</text>

      <path d="M2 200H500" stroke="#111111" stroke-opacity="0.14"/>
      <path d="M2 200H116" stroke="#333333" stroke-width="2"/>

      <text x="0" y="236" fill="#3F3D39" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2.5">AI RESEARCHER · ENGINEER · BUILDER</text>
      <text x="1" y="274" fill="#66625C" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="0.35">Connecting algorithms with intelligent systems</text>
      <text x="1" y="296" fill="#66625C" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="0.35">that work beyond the lab.</text>

      <g transform="translate(1 332)">
        <circle cx="5" cy="5" r="5" fill="#555555" fill-opacity="0.18"/>
        <circle cx="5" cy="5" r="2" fill="#333333"/>
        <text x="19" y="9" fill="#77736D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">MUST / MACAU / INTELLIGENT SYSTEMS</text>
      </g>
    </g>

    <path d="M0 397H1200" stroke="url(#goldRule)" stroke-width="3"/>
  </g>
</svg>
